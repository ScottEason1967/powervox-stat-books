<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statutory Registers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BRANDING — change these four values to re-skin the product.
   --brand   : primary accent (section rules, title, header border)
   --gold    : fine accent rule under the document title
   --brand-soft : a pale tint of the brand, used for highlights
   The masthead logo is set in the CONFIG block in the script
   near the bottom of this file (CONFIG.logoText / CONFIG.logoUrl).
   ============================================================ */
:root {
  --brand: #2D5F3F;        /* PowerVox Forest Green */
  --brand-2: #7B3F61;      /* PowerVox Mulberry (sparing accent) */
  --brand-soft: #D4DDD2;   /* Soft Sage */
  --linen: #F5F0EB;        /* Warm Linen */
  --stone: #B8A99A;        /* Warm Stone (rules / dividers) */
  --ink: #5C4A3A;          /* Warm Earth (body text, never black) */
  --muted: #8C7B6B;        /* Dusk (footer / secondary) */
  --line: #e3dccf;         /* soft linen-stone for table borders */
  --bg: #F5F0EB;           /* Warm Linen page surround */
  --sans: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  font-size: 15px; line-height: 1.55; color: var(--ink);
  background: var(--bg); margin: 0; padding: 0;
}

/* === App chrome (hidden on print & in exported file) === */
.appbar {
  position: sticky; top: 0; z-index: 50;
  background: #243B2E; color: #fff;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; flex-wrap: wrap;
}
.appbar .brandmark { font-weight: 700; letter-spacing: .2px; margin-right: auto; font-size: 15px; }
.appbar .brandmark span { color: var(--brand-soft); font-weight: 500; }
.btn {
  font: inherit; font-size: 13px; font-weight: 600;
  border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08);
  color: #fff; padding: 7px 12px; border-radius: 6px; cursor: pointer;
  transition: background .15s;
}
.btn:hover { background: rgba(255,255,255,.18); }
.btn.primary { background: var(--brand); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.toggle.active { background: var(--brand); border-color: var(--brand); }
.appbar .group { display: flex; gap: 6px; align-items: center; }
.appbar .sep { width: 1px; height: 22px; background: rgba(255,255,255,.2); }
.savestate { font-size: 12px; color: #9ca3af; }

/* === Page layout === */
.page { max-width: 1100px; margin: 0 auto; background: #fff; border: 1px solid var(--line); min-height: 60vh; }

/* === Header === */
header.masthead { background: #fff; color: var(--ink); padding: 36px 48px 28px; border-bottom: 3px solid var(--brand); text-align: center; }
header.masthead .logo { max-width: 320px; max-height: 90px; height: auto; margin-bottom: 14px; }
header.masthead .logotext { font-family: var(--sans); font-size: 34px; font-weight: 700; letter-spacing: -.3px; color: var(--brand); margin-bottom: 6px; }
header.masthead h1 { font-family: var(--sans); margin: 0 0 4px; font-size: 23px; font-weight: 600; letter-spacing: .2px; color: var(--ink); }
header.masthead .subtitle { font-size: 14px; color: var(--muted); margin: 0; }
header.masthead .doctitle { font-family: var(--sans); margin-top: 18px; font-size: 16px; font-weight: 600; letter-spacing: .3px; color: var(--brand-2); }
header.masthead .gold-rule { width: 56px; height: 2px; background: var(--brand-2); margin: 9px auto 0; }

/* === Navigation === */
nav.toc { background: #f9fafb; border-bottom: 1px solid var(--line); padding: 14px 48px; }
nav.toc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
nav.toc a { display: inline-block; padding: 6px 12px; font-size: 13px; color: #374151; text-decoration: none; border-radius: 4px; }
nav.toc a:hover { background: var(--line); color: #111827; }

/* === Main === */
main { padding: 32px 48px 48px; }
section { margin-bottom: 48px; scroll-margin-top: 80px; }
section h2 { font-family: var(--sans); font-size: 21px; font-weight: 600; color: var(--brand); border-bottom: 2px solid var(--brand); padding-bottom: 6px; margin: 0 0 18px; }
section h3 { font-size: 17px; font-weight: 600; color: #374151; margin: 24px 0 12px; }
.section-note { font-size: 14px; color: #4b5563; }

/* === Info grid === */
.info-grid { display: grid; grid-template-columns: 240px 1fr; gap: 6px 24px; margin: 12px 0; }
.info-grid dt { font-weight: 600; color: #4b5563; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
.info-grid dd { margin: 0; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }

/* === Tables === */
table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 14px; }
thead tr { background: #f3f4f6; }
th { text-align: left; font-weight: 600; padding: 10px 12px; border-bottom: 2px solid #d1d5db; color: #374151; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:hover { background: #fafafa; }
.numeric { text-align: right; font-variant-numeric: tabular-nums; }
.totals { font-weight: 700; background: #f9fafb; }
.totals td { border-top: 2px solid #d1d5db; }
.row-hl { background: #f7efe2; }
.row-hl-green { background: #eef3ec; }

/* === Details/summary === */
details { margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; background: #fafafa; }
details summary { cursor: pointer; padding: 12px 16px; font-weight: 600; color: #1f2937; user-select: none; list-style: none; position: relative; padding-right: 36px; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "\25B8"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); transition: transform .2s; color: #9ca3af; }
details[open] summary::after { transform: translateY(-50%) rotate(90deg); }
details summary:hover { background: #f3f4f6; }
details .inner { padding: 8px 16px 16px; border-top: 1px solid var(--line); }

/* === Badges === */
.badge { display: inline-block; padding: 2px 8px; font-size: 12px; font-weight: 600; border-radius: 10px; vertical-align: middle; margin-left: 6px; }
.badge-current { background: #D4DDD2; color: #2D5F3F; }
.badge-ceased { background: #efe7dd; color: #8C7B6B; }
.badge-unfiled { background: #f3dede; color: #8a2b2b; }
.badge-pending { background: #efe3c9; color: #8a6d2e; }

/* === Alerts === */
.alert { border-left: 4px solid; padding: 12px 16px; margin: 16px 0; border-radius: 4px; font-size: 14px; }
.alert-warn { background: #fffbeb; border-color: #f59e0b; color: #78350f; }
.alert-info { background: #eff6ff; border-color: #3b82f6; color: #1e3a8a; }
.alert-success { background: #eef3ec; border-color: #2D5F3F; color: #2D5F3F; }
.alert strong { display: block; margin-bottom: 4px; }

/* === Footer === */
footer { background: #f9fafb; border-top: 1px solid var(--line); padding: 24px 48px; font-size: 13px; color: var(--muted); }
footer p { margin: 4px 0; }

/* ============================================================
   EDITOR styles (screen only)
   ============================================================ */
.edit-section { border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin-bottom: 22px; background: #fff; }
.edit-section > h3.edit-title { margin: 0 0 14px; font-size: 16px; color: var(--brand); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.field { margin: 0 0 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 4px; }
.field input[type=text], .field input[type=number], .field textarea, .field select, .grid-table input, .grid-table textarea, .grid-table select {
  width: 100%; font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 5px; background: #fff;
}
.field textarea { min-height: 70px; resize: vertical; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 14px; }
.grid-table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
.grid-table th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: #6b7280; padding: 4px 6px; text-align: left; border: none; background: transparent; }
.grid-table td { padding: 3px 6px; border: none; vertical-align: top; }
.grid-table textarea { min-height: 40px; }
.mini { font-size: 12px; padding: 5px 9px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
.mini:hover { background: #e5e7eb; }
.mini.danger { color: #991b1b; }
.add-row { margin-top: 4px; }
.hist-card { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin: 10px 0; background: #fafafa; }
.hist-card .hc-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.hist-card .hc-head input { flex: 1; }
.helptext { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.editor-only { display: none; }
body.mode-edit .editor-only { display: block; }
body.mode-edit .view-only { display: none; }
body.mode-view .editor-only { display: none; }

/* === Modal === */
.modal-back { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
.modal-back.open { display: flex; }
.modal { background: #fff; border-radius: 10px; max-width: 760px; width: 100%; padding: 26px 30px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h2 { margin: 0 0 6px; font-size: 20px; color: #111827; border: none; }
.modal p.sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.modal textarea { width: 100%; min-height: 150px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
.modal .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.modal .btn { color: #111827; border-color: #d1d5db; background: #f3f4f6; }
.modal .btn:hover { background: #e5e7eb; }
.modal .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.modal .btn.primary:hover { filter: brightness(1.08); }
.merge-log { font-size: 13px; background: #f9fafb; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-top: 14px; max-height: 240px; overflow: auto; }
.merge-log li { margin: 3px 0; }
.merge-log .added { color: #065f46; }
.merge-log .conflict { color: #92400e; }
.merge-log .skipped { color: var(--muted); }

/* === Print === */
@media print {
  .appbar, nav.toc, .editor-only { display: none !important; }
  body { background: #fff; font-size: 11pt; }
  .page { box-shadow: none; max-width: 100%; }
  body.mode-edit .view-only { display: block !important; }
  body.mode-edit .editor-only { display: none !important; }
  header.masthead { border-bottom: 2px solid var(--ink); padding: 16px 24px; }
  header.masthead .doctitle, header.masthead .logotext { color: var(--ink); }
  main { padding: 16px 24px; }
  section { page-break-inside: avoid; }
  details { border: none; background: transparent; }
  details summary { display: none; }
  details .inner { border-top: none; padding: 0; }
  details[open] .inner, details:not([open]) .inner { display: block; }
  table { font-size: 10pt; }
  @page { size: A4; margin: 15mm 12mm; }
}
</style>
</head>
<body class="mode-edit">

<!-- ============================ APP BAR ============================ -->
<div class="appbar" id="appbar">
  <div class="brandmark" id="appBrand">PowerVox <span>Statutory Registers</span></div>
  <div class="group">
    <button class="btn toggle active" id="btnEdit">Edit</button>
    <button class="btn toggle" id="btnView">View</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" id="btnImport">Import from Companies House</button>
    <button class="btn" id="btnExport">Export register</button>
    <button class="btn" id="btnSaveFile">Save data</button>
    <button class="btn" id="btnLoadFile">Load data</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" id="btnSample">Load sample</button>
    <button class="btn" id="btnBlank">Blank template</button>
  </div>
  <div class="savestate" id="saveState">Not saved yet</div>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none">
</div>

<div class="page">

<!-- ============================ MASTHEAD ============================ -->
<header class="masthead">
  <div id="mastheadLogo"></div>
  <h1 id="mhName">Company Name Limited</h1>
  <p class="subtitle" id="mhSub">Private company limited by shares</p>
  <p class="doctitle">Statutory Registers</p>
  <div class="gold-rule"></div>
</header>

<!-- ============================ TOC (view only) ============================ -->
<nav class="toc view-only">
  <ul>
    <li><a href="#info">Company Information</a></li>
    <li><a href="#directors">Directors</a></li>
    <li><a href="#members">Members</a></li>
    <li><a href="#allotments">Allotments &amp; Transfers</a></li>
    <li><a href="#psc">PSC Register</a></li>
    <li><a href="#certificates">Share Certificates</a></li>
    <li><a href="#filings">Filings Outstanding</a></li>
  </ul>
</nav>

<main>
  <!-- VIEW MODE renders here -->
  <div class="view-only" id="viewRoot"></div>
  <!-- EDIT MODE renders here -->
  <div class="editor-only" id="editRoot"></div>
</main>

<footer id="footerRoot"></footer>

</div><!-- /.page -->

<!-- ============================ MODAL ============================ -->
<div class="modal-back" id="modalBack">
  <div class="modal" id="modalBody"></div>
</div>

  // server-side). Relative path so it works wherever the page is hosted.
  // When the page is opened from disk this call simply fails and the offline

/* ============================================================
   STATE
   ============================================================ */
const LS_KEY = "powervox_statutory_register_v1";
let data = loadFromStorage() || blankTemplate();

function loadFromStorage() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function save(quiet) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    const t = new Date();
    setSaveState("Saved " + t.toLocaleTimeString());
  } catch (e) { setSaveState("Save failed (storage blocked)"); }
}
function setSaveState(msg) { const el = document.getElementById("saveState"); if (el) el.textContent = msg; }

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function badge(type, label) {
  const map = { current: "badge-current", ceased: "badge-ceased", unfiled: "badge-unfiled", pending: "badge-pending" };
  return '<span class="badge ' + (map[type] || "badge-current") + '">' + esc(label) + '</span>';
}

/* ============================================================
   EDIT RENDERER
   ============================================================ */
function input(value, path, type) {
  type = type || "text";
  const v = value === null || value === undefined ? "" : value;
  if (type === "textarea") return '<textarea data-path="' + path + '">' + esc(v) + "</textarea>";
  return '<input type="' + type + '" data-path="' + path + '" value="' + esc(v) + '">';
}
function selectInput(value, path, options) {
  let o = options.map(op => '<option value="' + esc(op) + '"' + (op === value ? " selected" : "") + ">" + esc(op) + "</option>").join("");
  return '<select data-path="' + path + '">' + o + "</select>";
}

function gridTable(listPath, list, cols, addLabel) {
  let h = '<table class="grid-table"><thead><tr>';
  cols.forEach(col => { h += "<th>" + esc(col.label) + "</th>"; });
  h += "<th></th></tr></thead><tbody>";
  list.forEach((row, i) => {
    h += "<tr>";
    cols.forEach(col => {
      const path = listPath + "." + i + "." + col.key;
      let field;
      if (col.type === "select") field = selectInput(row[col.key], path, col.options);
      else if (col.type === "textarea") field = input(row[col.key], path, "textarea");
      else field = input(row[col.key], path, col.type || "text");
      h += '<td' + (col.w ? ' style="width:' + col.w + '"' : "") + ">" + field + "</td>";
    });
    h += '<td><button class="mini danger" data-del="' + listPath + '" data-idx="' + i + '">✕</button></td>';
    h += "</tr>";
  });
  h += "</tbody></table>";
  h += '<button class="mini add-row" data-add="' + listPath + '">+ ' + esc(addLabel || "Add row") + "</button>";
  return h;
}

/* ============================================================
   PATH GET / SET
   ============================================================ */
function getByPath(path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), data);
}
function setByPath(path, value) {
  const parts = path.split(".");
  let o = data;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  let key = parts[parts.length - 1];
  o[key] = value;
}
function coerce(raw) {
  if (raw === "true") return true;
  if (raw === "false") return false;
  return raw;
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function wireEditorEvents() {
  const root = document.getElementById("editRoot");
  root.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.path) {
      setByPath(t.dataset.path, t.tagName === "SELECT" ? coerce(t.value) : t.value);
      save();
      // keep masthead live as you type the company name
      if (t.dataset.path.indexOf("company.") === 0) renderMasthead();
    }
  });
  root.addEventListener("click", e => {
    const add = e.target.dataset.add, del = e.target.dataset.del;
    if (add) { addRow(add); return; }
    if (del !== undefined && e.target.dataset.idx !== undefined) { delRow(del, parseInt(e.target.dataset.idx, 10)); return; }
  });
}

function templateFor(listPath) {
  if (listPath === "company.officeHistory") return { from: "", to: "", address: "", current: false };
  if (listPath === "directors.current") return { name: "", serviceAddress: "", appointed: "", status: "in office" };
  if (listPath === "directors.history") return { name: "", note: "", rows: [{ event: "", date: "", filed: "" }] };
  if (/^directors\.history\.\d+\.rows$/.test(listPath)) return { event: "", date: "", filed: "" };
  if (listPath === "members.current") return { member: "", address: "", cls: "Ordinary", shares: "", nominal: "", paidUp: "Fully paid" };
  if (listPath === "members.history") return { member: "", currentNote: "", rows: [{ date: "", event: "", inOut: "", balance: "" }] };
  if (/^members\.history\.\d+\.rows$/.test(listPath)) return { date: "", event: "", inOut: "", balance: "" };
  if (listPath === "allotments.rows") return { date: "", type: "Allotment", details: "", filing: "", hl: "" };
  if (listPath === "allotments.classRights") return { cls: "", voting: "", dividend: "", capital: "" };
  if (listPath === "psc.current") return { name: "", nature: "", from: "", status: "current" };
  if (listPath === "psc.history") return { date: "", person: "", action: "", filed: "", hl: "" };
  if (listPath === "certificates.rows") return { certNo: "", holder: "", cls: "", shares: "", issued: "", status: "current", statusType: "current" };
  if (listPath === "filings.rows") return { form: "", event: "", effective: "", deadline: "", status: "pending", statusType: "pending" };
  return {};
}
function addRow(listPath) { const list = getByPath(listPath); list.push(templateFor(listPath)); save(); renderEdit(); }
function delRow(listPath, idx) { const list = getByPath(listPath); list.splice(idx, 1); save(); renderEdit(); }

/* ============================================================
   MODE TOGGLE
   ============================================================ */
function setMode(mode) {
  document.body.className = "mode-" + mode;
  document.getElementById("btnEdit").classList.toggle("active", mode === "edit");
  document.getElementById("btnView").classList.toggle("active", mode === "view");
  if (mode === "view") renderView();
}

/* ============================================================
   EXPORT (clean, view-only standalone HTML)
   ============================================================ */
function exportRegister() {
  renderView();
  const clone = document.documentElement.cloneNode(true);
  // strip editor chrome from the clone
  ["appbar", "modalBack"].forEach(id => { const n = clone.querySelector("#" + id); if (n) n.remove(); });
  clone.querySelectorAll(".editor-only").forEach(n => n.remove());
  const body = clone.querySelector("body");
  body.className = "mode-view";
  // remove the live scripts so the exported file is a static document
  clone.querySelectorAll("script").forEach(n => n.remove());
  // remove the empty edit root
  const er = clone.querySelector("#editRoot"); if (er) er.remove();
  const html = "<!DOCTYPE html>\n" + clone.outerHTML;
  downloadFile(html, (data.company.name || "statutory-register").replace(/[^a-z0-9]+/gi, "_") + "_Statutory_Register.html", "text/html");
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
}

/* ============================================================
   SAVE / LOAD DATA FILE
   ============================================================ */
function saveDataFile() {
  downloadFile(JSON.stringify(data, null, 2), (data.company.name || "register-data").replace(/[^a-z0-9]+/gi, "_") + ".json", "application/json");
}
function loadDataFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try { const parsed = JSON.parse(r.result); data = mergeDefaults(parsed); save(); renderAll(); alert("Data loaded."); }
    catch (e) { alert("That file could not be read as register data."); }
  };
  r.readAsText(file);
}
// ensure loaded data has all keys the UI expects
function mergeDefaults(parsed) {
  const base = blankTemplate();
  const out = Object.assign({}, base, parsed);
  for (const k in base) { if (parsed[k] && typeof base[k] === "object" && !Array.isArray(base[k])) out[k] = Object.assign({}, base[k], parsed[k]); }
  return out;
}

// Normalise CH date (yyyy-mm-dd) to "D Month yyyy"
function chDate(s) {
  if (!s) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return s;
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return parseInt(m[3], 10) + " " + months[parseInt(m[2], 10) - 1] + " " + m[1];
}
function addrToString(a) {
  if (!a) return "";
  if (typeof a === "string") return a;
  return [a.premises, a.address_line_1, a.address_line_2, a.locality, a.region, a.postal_code, a.country]
    .filter(Boolean).join(", ");
}

/* Non-destructive merge of CH payload into the model. Returns a log. */
function mergeCompaniesHouse(p) {
  const log = [];
  // ---- Company ----
  const co = p.company || {};
  function fill(field, value, label) {
    if (!value) return;
    const cur = data.company[field];
    if (!cur) { data.company[field] = value; log.push({ kind: "added", msg: "Set " + label + ": " + value }); }
    else if (String(cur).trim() !== String(value).trim()) { log.push({ kind: "conflict", msg: label + " differs — kept your value (\"" + cur + "\"); Companies House shows \"" + value + "\"" }); }
    else log.push({ kind: "skipped", msg: label + " already matches" });
  }
  if (co.company_name) fill("name", co.company_name, "company name");
  if (co.company_number) fill("number", co.company_number, "company number");
  if (co.type) fill("type", humanType(co.type), "company type");
  if (co.date_of_creation) fill("incorporated", chDate(co.date_of_creation), "incorporation date");
  if (co.registered_office_address) fill("registeredOffice", addrToString(co.registered_office_address), "registered office");
  if (co.sic_codes && co.sic_codes.length) fill("sicCode", co.sic_codes.join(", "), "SIC code");
  if (co.accounts && co.accounts.accounting_reference_date) {
    const ard = co.accounts.accounting_reference_date;
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    if (ard.day && ard.month) fill("accountingRefDate", parseInt(ard.day,10) + " " + months[parseInt(ard.month,10)-1], "accounting reference date");
  }

  // ---- Officers -> directors ----
  (p.officers || []).forEach(o => {
    const raw = o.name || "";
    if (!raw) return;
    const disp = displayName(raw);
    const appointed = chDate(o.appointed_on);
    const resigned = o.resigned_on ? chDate(o.resigned_on) : "";
    // current directors: only those not resigned (dedupe on display name + appointment)
    if (!resigned) {
      const exists = data.directors.current.some(d => sameName(d.name, disp) && d.appointed === appointed);
      if (!exists) {
        data.directors.current.push({ name: disp, serviceAddress: addrToString(o.address), appointed: appointed, status: "in office" });
        log.push({ kind: "added", msg: "Added current director: " + disp });
      }
    }
    // history card per officer (one card per display name; events merged in)
    let card = data.directors.history.find(c => sameName(c.name, disp));
    if (!card) { card = { name: disp, note: officerNote(o), rows: [] }; data.directors.history.push(card); }
    else if (!card.note) card.note = officerNote(o);
    if (appointed && !card.rows.some(r => r.date === appointed && /appoint/i.test(r.event))) {
      card.rows.push({ event: "Appointed", date: appointed, filed: "" });
      log.push({ kind: "added", msg: "Added appointment event for " + disp + " (" + appointed + ")" });
    }
    if (resigned && !card.rows.some(r => r.date === resigned && /resign/i.test(r.event))) {
      card.rows.push({ event: "Resigned", date: resigned, filed: "" });
      log.push({ kind: "added", msg: "Added resignation event for " + disp + " (" + resigned + ")" });
    }
  });

  // ---- PSCs ----
  (p.psc || []).forEach(s => {
    const raw = (s.name || (s.name_elements ? [s.name_elements.forename, s.name_elements.middle_name, s.name_elements.surname].filter(Boolean).join(" ") : "")) || "";
    if (!raw) return;
    const disp = displayName(raw);
    const nature = (s.natures_of_control || []).map(humanNature).join("; ");
    const from = chDate(s.notified_on);
    const ceased = s.ceased_on ? chDate(s.ceased_on) : "";
    if (!ceased) {
      const exists = data.psc.current.some(x => sameName(x.name, disp) && x.from === from);
      if (!exists) { data.psc.current.push({ name: disp, nature: nature, from: from, status: "current" }); log.push({ kind: "added", msg: "Added current PSC: " + disp }); }
    }
    if (from && !data.psc.history.some(x => sameName(x.person, disp) && x.date === from && /notif|regist/i.test(x.action))) {
      data.psc.history.push({ date: from, person: disp, action: "Notified as PSC: " + nature, filed: "", hl: "" });
      log.push({ kind: "added", msg: "Added PSC notification for " + disp });
    }
    if (ceased && !data.psc.history.some(x => sameName(x.person, disp) && x.date === ceased && /cess|ceas/i.test(x.action))) {
      data.psc.history.push({ date: ceased, person: disp, action: "Cessation as PSC", filed: "", hl: "" });
      log.push({ kind: "added", msg: "Added PSC cessation for " + disp });
    }
  });

  // ---- Filings -> allotments (share-related forms only) ----
  (p.filings || []).forEach(f => {
    const type = (f.type || "").toUpperCase();
    const date = chDate(f.date);
    const desc = f.description_values && f.description_values.description ? f.description_values.description : (f.description || "");
    if (/^SH0|^SH2|^SH3|CAPITAL/i.test(type) || /allot|capital|sub-?division|transfer of/i.test(desc)) {
      if (!data.allotments.rows.some(r => r.date === date && (r.filing || "").indexOf(type) >= 0)) {
        data.allotments.rows.push({ date: date, type: shareType(type), details: desc || "(see filing)", filing: type + (f.date ? " filed " + chDate(f.date) : ""), hl: "" });
        log.push({ kind: "added", msg: "Added share event from " + type + " (" + date + ")" });
      }
    }
  });

  // ---- Due dates -> filings reconciliation ----
  if (p.company) {
    const acc = co.accounts && co.accounts.next_due ? chDate(co.accounts.next_due) : "";
    const cs = co.confirmation_statement && co.confirmation_statement.next_due ? chDate(co.confirmation_statement.next_due) : "";
    let note = data.filings.reconciledNote || "";
    const bits = [];
    if (acc) bits.push("Next accounts due " + acc);
    if (cs) bits.push("next confirmation statement due " + cs);
    if (bits.length) {
      data.filings.reconciledNote = note.replace(/\s*Next accounts.*$/i, "").trim() + " " + bits.join("; ") + ".";
      log.push({ kind: "added", msg: "Recorded CH due dates: " + bits.join("; ") });
    }
  }

  // ---- tidy: drop fully-empty seed rows the template ships with ----
  pruneBlanks();

  if (!log.length) log.push({ kind: "skipped", msg: "Nothing new to import — your register already matches the Companies House data provided." });
  return log;
}
// Remove rows where every value is empty (template placeholders), but always
// keep at least one row in a list so the editor still shows an add point.
function pruneBlanks() {
  function allEmpty(obj, keys) { return keys.every(k => { const v = obj[k]; return v === "" || v === null || v === undefined; }); }
  function prune(list, keys, keepOne) {
    for (let i = list.length - 1; i >= 0; i--) {
      if (allEmpty(list[i], keys)) { if (keepOne && list.length === 1) break; list.splice(i, 1); }
    }
    if (keepOne && list.length === 0) list.push({});
  }
  prune(data.directors.current, ["name", "serviceAddress", "appointed"], false);
  prune(data.directors.history, ["name"], false);
  prune(data.psc.current, ["name", "nature", "from"], false);
  prune(data.members.current, ["member", "address", "shares"], false);
  prune(data.allotments.rows, ["date", "details", "filing"], false);
  prune(data.certificates.rows, ["certNo", "holder", "shares"], false);
  prune(data.psc.history, ["date", "person", "action"], false);
  prune(data.members.history, ["member"], false);
}
function sameName(a, b) { return a && b && a.replace(/[^a-z]/gi, "").toLowerCase() === b.replace(/[^a-z]/gi, "").toLowerCase(); }
function displayName(n) {
  // CH officer names often come as "SURNAME, Forename" — flip to natural order
  if (/,/.test(n)) { const parts = n.split(","); return (parts[1] || "").trim() + " " + titleCase((parts[0] || "").trim()); }
  return n;
}
function titleCase(s) { return s.toLowerCase().replace(/\b\w/g, m => m.toUpperCase()); }
function humanType(t) {
  const map = { "ltd": "Private company limited by shares", "private-limited-guarant-nsc": "Private company limited by guarantee", "plc": "Public limited company" };
  return map[t] || "Private company limited by shares";
}
function shareType(t) {
  if (/SH01/.test(t)) return "Allotment"; if (/SH02/.test(t)) return "Sub-division"; if (/SH0[34]/.test(t)) return "Capital change";
  return "Share event";
}
function officerNote(o) {
  const bits = [];
  if (o.nationality) bits.push("Nationality: " + o.nationality + ".");
  if (o.country_of_residence) bits.push("Country of usual residence: " + o.country_of_residence + ".");
  if (o.occupation) bits.push("Business occupation: " + o.occupation + ".");
  if (o.date_of_birth && o.date_of_birth.month && o.date_of_birth.year) bits.push("Date of birth: ** / " + String(o.date_of_birth.month).padStart(2, "0") + " / " + o.date_of_birth.year + ".");
  return bits.join(" ");
}
function humanNature(code) {
  const map = {
    "ownership-of-shares-25-to-50-percent": "Holds, directly, more than 25% but not more than 50% of the shares",
    "ownership-of-shares-50-to-75-percent": "Holds, directly, more than 50% but not more than 75% of the shares",
    "ownership-of-shares-75-to-100-percent": "Holds, directly, 75% or more of the shares",
    "voting-rights-25-to-50-percent": "Holds, directly, more than 25% but not more than 50% of the voting rights",
    "voting-rights-50-to-75-percent": "Holds, directly, more than 50% but not more than 75% of the voting rights",
    "voting-rights-75-to-100-percent": "Holds, directly, 75% or more of the voting rights",
    "right-to-appoint-and-remove-directors": "Has the right to appoint or remove a majority of the board of directors",
    "significant-influence-or-control": "Has significant influence or control"
  };
  return map[code] || code.replace(/-/g, " ");
}

// One-click pull. Calls the site's own backend endpoint, which holds the API
// key and talks to Companies House. The visitor's browser only ever calls this
// site, so there is no key exposure and no cross-origin block.
async function pullFromBackend() {
  const num = document.getElementById("chNum").value.trim().replace(/\s+/g, "");
  const status = document.getElementById("chStatus");
  if (!num) { status.textContent = "Enter a company number first."; return; }
  status.textContent = "Fetching from Companies House…";
  try {
    const resp = await fetch(CONFIG.chEndpoint + "?number=" + encodeURIComponent(num), { headers: { "Accept": "application/json" } });
    if (!resp.ok) {
      let msg;
      if (resp.status === 404) msg = "No company found with that number (or the pull service is not available here).";
      else { const e = await resp.json().catch(() => ({})); msg = e.error || ("Pull failed (" + resp.status + ")."); }
      status.textContent = msg + " If you are viewing this file locally, use the offline option below.";
      document.getElementById("offlineDetails").open = true;
      return;
    }
    const payload = await resp.json();
    const log = mergeCompaniesHouse(payload);
    showMergeLog(log); save(); renderAll();
    status.textContent = "Done. Review the import summary below, then close and edit anything you need.";
  } catch (e) {
    status.textContent = "Could not reach the pull service. This is normal when the file is opened from disk rather than on the PowerVox site. Use the offline option below.";
    document.getElementById("offlineDetails").open = true;
  }
}

  document.getElementById("btnExport").onclick = exportRegister;

  document.getElementById("btnSample").onclick = () => { if (confirm("Load the sample (Eason Law) data? This replaces the current contents.")) { data = easonSample(); save(); renderAll(); } };
  document.getElementById("btnBlank").onclick = () => { if (confirm("Clear everything to a blank template? This cannot be undone.")) { data = blankTemplate(); save(); renderAll(); } };
  document.getElementById("modalBack").onclick = e => { if (e.target.id === "modalBack") closeModal(); };
  setSaveState(localStorage.getItem(LS_KEY) ? "Loaded from this browser" : "Not saved yet");
}
